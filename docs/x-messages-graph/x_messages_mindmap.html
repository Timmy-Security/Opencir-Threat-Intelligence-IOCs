<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCIR Graph — global / x-ai-reader-graph</title>
  <style>
:root {
  --bg: #070b12;
  --bg-2: #0c1420;
  --ink: #e3edf9;
  --dim: #8fabc6;
  --mute: #5d738c;
  --line: rgba(140, 180, 220, 0.16);
  --cyan: #4de0ff;
  --green: #67e8a6;
  --green-deep: #113326;
  --red: #fa7c88;
  --gold: #f0c36a;
  --orange: #f0a35a;
  --pink: #f472e8;
  --card: #121f30;
  --panel: rgba(8, 14, 24, 0.78);
  --font: "SF Mono", "Menlo", "Consolas", "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  cursor: default;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
}
#hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* —— top nav —— */
.nav {
  pointer-events: auto;
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px 0 16px;
  background: linear-gradient(180deg, rgba(7,11,18,0.94) 0%, rgba(7,11,18,0.72) 70%, rgba(7,11,18,0) 100%);
  border-bottom: 1px solid rgba(80, 120, 160, 0.14);
}
.mesh-mark {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}
.mesh-mark .glyph {
  width: 18px; height: 18px;
  display: block;
}
.mesh-mark .word {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #f4fbff;
  text-shadow: 0 0 16px rgba(77,224,255,0.35);
}
.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
}
.tabs a, .tabs span {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--dim);
  padding: 6px 10px;
  border-radius: 6px;
  text-decoration: none;
  cursor: default;
}
.tabs .on {
  color: #e8fbff;
  background: rgba(77,224,255,0.1);
  box-shadow: 0 0 12px rgba(77,224,255,0.12);
}
.path {
  flex: 1;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: #c9d8ea;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.path em {
  font-style: normal;
  color: var(--cyan);
}

.stats {
  display: flex;
  align-items: stretch;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: rgba(10,16,26,0.7);
  box-shadow: 0 8px 28px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04);
}
.stat {
  padding: 6px 11px 5px;
  min-width: 72px;
  border-right: 1px solid var(--line);
  text-align: right;
}
.stat:last-child { border-right: 0; }
.stat .ico-lbl {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  font-size: 8px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 600;
}
.stat .num {
  font-size: 18px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  line-height: 1.15;
  color: #f3f7ff;
}
.stat.posts .num { color: var(--cyan); }
.stat.authors .num { color: #9eb8ff; }
.stat.ai .num { color: var(--green); }
.stat.notai .num { color: var(--red); }
.stat.delivered .num { color: var(--gold); }
.stat.models .num { color: #f9a8ef; }

.snapshot {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--gold);
  border: 1px solid rgba(240,195,106,0.4);
  padding: 6px 8px;
  border-radius: 6px;
  text-shadow: 0 0 10px rgba(240,195,106,0.25);
  white-space: nowrap;
}

/* —— toolbar —— */
.toolbar {
  pointer-events: auto;
  position: absolute;
  top: 58px;
  left: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
#search {
  width: min(340px, 36vw);
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  color: var(--ink);
  font: 500 12px/1.2 var(--font);
  padding: 7px 11px;
  outline: none;
  border-radius: 7px;
}
#search:focus {
  border-color: rgba(77,224,255,0.55);
  box-shadow: 0 0 0 1px rgba(77,224,255,0.18);
}
#search::placeholder { color: #6d7b90; }
.chip, #replay, #collapse {
  background: transparent;
  border: 1px solid var(--line);
  color: #c5d0e0;
  font: 600 10px/1 var(--font);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 7px 10px;
  cursor: pointer;
  border-radius: 7px;
}
.chip.on {
  border-color: rgba(77,224,255,0.6);
  color: #e8fbff;
  box-shadow: 0 0 12px rgba(77,224,255,0.18);
  background: rgba(77,224,255,0.08);
}
#replay {
  border-color: rgba(240,195,106,0.45);
  color: var(--gold);
  margin-left: auto;
}
#collapse { border-color: rgba(103,232,166,0.28); color: #b7f0d0; }
.chip:hover, #replay:hover, #collapse:hover { background: rgba(255,255,255,0.05); }
#showing {
  font-size: 10px;
  color: #8fa0b8;
  letter-spacing: 0.03em;
}

/* —— log + summary (HTML, bottom-right) —— */
.log {
  pointer-events: auto;
  position: absolute;
  right: 16px;
  bottom: 44px;
  width: min(380px, 36vw);
  max-height: min(240px, 32vh);
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px 11px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.log.show { opacity: 1; transform: none; }
.log .hd {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 6px;
}
.log pre {
  font: 11px/1.55 var(--font);
  color: #c9d8ea;
  white-space: pre-wrap;
  word-break: break-word;
}
.log pre .k { color: var(--cyan); }
.log pre .g { color: var(--green); }
.log pre .y { color: var(--gold); }
.log pre .d { color: var(--dim); }

.summary-flag {
  pointer-events: none;
  position: absolute;
  right: 16px;
  bottom: calc(44px + min(240px, 32vh) + 10px);
  width: min(380px, 36vw);
  background: rgba(17, 51, 38, 0.82);
  border: 1px solid rgba(103,232,166,0.4);
  border-radius: 8px;
  padding: 8px 12px;
  color: #b8f5d4;
  font-size: 11px;
  letter-spacing: 0.02em;
  line-height: 1.45;
  box-shadow: 0 0 24px rgba(103,232,166,0.12);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.summary-flag.show { opacity: 1; transform: none; }
.summary-flag b { color: #e8ffef; font-weight: 700; }

.footer {
  pointer-events: none;
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 10px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 10px;
  color: var(--mute);
  letter-spacing: 0.04em;
}
.footer #status { color: var(--green); }

#tooltip {
  position: fixed;
  z-index: 5;
  width: min(360px, calc(100vw - 32px));
  padding: 12px 14px 13px;
  background: rgba(7, 10, 20, 0.94);
  border: 1px solid rgba(140,180,220,0.25);
  box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  pointer-events: none;
  color: var(--ink);
  border-radius: 8px;
}
#tooltip[hidden] { display: none; }
#tooltip .k {
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cyan);
  font-weight: 600;
}
#tooltip .t { font-size: 14px; font-weight: 650; margin: 3px 0 4px; }
#tooltip .when { font-size: 11px; color: #d7c48a; margin-bottom: 8px; }
#tooltip .tx {
  font-size: 12px;
  line-height: 1.45;
  color: #dce4f0;
  white-space: pre-wrap;
  margin-bottom: 8px;
  max-height: 9.5em;
  overflow: hidden;
}
#tooltip .metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin-bottom: 6px;
}
#tooltip .m { font-size: 11px; color: #e8eef8; font-variant-numeric: tabular-nums; }
#tooltip .m em { font-style: normal; color: #8fa0b8; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
#tooltip .s { font-size: 10px; color: #8fa0b8; line-height: 1.4; }

.corners span {
  position: fixed;
  width: 14px;
  height: 14px;
  pointer-events: none;
  z-index: 3;
  border-color: rgba(77,224,255,0.35);
  border-style: solid;
}
.corners .tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.corners .tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
.corners .bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
.corners .br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

@media (max-width: 1100px) {
  .stat { min-width: 58px; padding: 5px 8px 4px; }
  .stat .num { font-size: 16px; }
  .path { display: none; }
  .log, .summary-flag { width: min(340px, 46vw); }
}

/* —— OpenCIR Graph: real tabs, richer filters, page views —— */
.mesh-mark .brand-logo {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: block;
  box-shadow: 0 0 16px rgba(244, 114, 232, 0.28);
  flex: 0 0 28px;
  background: #12081c;
}
.mesh-mark .word { letter-spacing: 0.08em; font-size: 13px; }
.tabs a {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--dim);
  padding: 6px 10px;
  border-radius: 6px;
  text-decoration: none;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  font-family: inherit;
}
.tabs a:hover { color: #e8fbff; background: rgba(255,255,255,0.04); }
.tabs a.on, .tabs a[aria-selected="true"] {
  color: #e8fbff;
  background: rgba(77,224,255,0.1);
  box-shadow: 0 0 12px rgba(77,224,255,0.12);
  border-color: rgba(77,224,255,0.28);
}
.tabs a:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

.toolbar {
  top: 56px;
  gap: 8px;
  row-gap: 8px;
  padding-bottom: 6px;
  background: linear-gradient(180deg, rgba(7,11,18,0.9) 0%, rgba(7,11,18,0.72) 78%, rgba(7,11,18,0) 100%);
}
#search, #author-search, #filter-company, #filter-from, #filter-to {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  color: var(--ink);
  font: 500 12px/1.2 var(--font);
  padding: 7px 10px;
  outline: none;
  border-radius: 7px;
}
#search { width: min(260px, 28vw); }
#author-search { width: min(150px, 16vw); }
#filter-company { min-width: 132px; cursor: pointer; }
#filter-from, #filter-to { width: 132px; color-scheme: dark; }
#search:focus, #author-search:focus, #filter-company:focus, #filter-from:focus, #filter-to:focus {
  border-color: rgba(77,224,255,0.55);
  box-shadow: 0 0 0 1px rgba(77,224,255,0.18);
}
.date-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
#clear-filters {
  border-color: rgba(250,124,136,0.35);
  color: #f5b0b6;
}
#filter-note {
  font-size: 10px;
  color: #8fa0b8;
  letter-spacing: 0.02em;
  flex: 1 1 100%;
}
#filter-note:empty { display: none; }
body:not([data-view="global"]) #collapse,
body:not([data-view="global"]) #replay { display: none; }

#view-panel {
  display: none;
  position: fixed;
  left: 0; right: 0; bottom: 0;
  top: 148px;
  z-index: 3;
  overflow: auto;
  background: var(--bg);
  padding: 8px 22px 48px;
  color: var(--ink);
}
body:not([data-view="global"]) #view-panel { display: block; }
body:not([data-view="global"]) #stage { visibility: hidden; pointer-events: none; }
body:not([data-view="global"]) #tooltip { display: none !important; }
body:not([data-view="global"]) .footer { display: none; }

.view-sec { max-width: 1180px; margin: 0 auto; }
.view-sec h1 {
  font-size: 20px;
  font-weight: 650;
  letter-spacing: 0.04em;
  margin: 8px 0 6px;
}
.view-sec .lede {
  color: var(--dim);
  font-size: 12px;
  line-height: 1.55;
  margin: 0 0 16px;
  max-width: 860px;
}
.view-sec h2 {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cyan);
  margin: 22px 0 10px;
}
.view-sec .derived {
  color: var(--gold);
  font-size: 11px;
  line-height: 1.5;
  margin: 0 0 14px;
  max-width: 860px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  background: rgba(12, 20, 32, 0.65);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.data-table th, .data-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid rgba(140,180,220,0.1);
  vertical-align: top;
}
.data-table th {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 650;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  background: rgba(8,14,24,0.8);
}
.data-table th:hover { color: var(--ink); }
.data-table th[aria-sort="ascending"]::after { content: " ↑"; color: var(--cyan); }
.data-table th[aria-sort="descending"]::after { content: " ↓"; color: var(--cyan); }
.data-table tbody tr { cursor: pointer; }
.data-table tbody tr:hover { background: rgba(77,224,255,0.06); }
.data-table .num { font-variant-numeric: tabular-nums; text-align: right; }
.data-table th.num { text-align: right; }
.data-table .muted { color: var(--dim); }
.data-table a, .post-link {
  color: var(--cyan);
  text-decoration: none;
}
.data-table a:hover, .post-link:hover { text-decoration: underline; }
.badge-ai, .badge-no, .badge-unk, .badge-del, .badge-model {
  display: inline-block;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 4px;
  border: 1px solid;
}
.badge-ai { color: var(--green); border-color: rgba(103,232,166,0.4); }
.badge-no { color: var(--red); border-color: rgba(250,124,136,0.4); }
.badge-unk { color: var(--dim); border-color: rgba(143,171,198,0.35); }
.badge-del { color: var(--gold); border-color: rgba(240,195,106,0.45); }
.badge-model { color: #f9a8ef; border-color: rgba(244,114,232,0.4); }

.run-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px 8px;
  margin: 0 0 14px;
  background: rgba(12,20,32,0.65);
}
.run-card h3 {
  font-size: 14px;
  margin: 0 0 4px;
}
.run-card .meta { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
.rules article {
  max-width: 760px;
  font-size: 13px;
  line-height: 1.6;
  color: #d5e0ee;
}
.rules article ol, .rules article ul { padding-left: 20px; margin: 8px 0 14px; }
.rules article li { margin: 6px 0; }
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 16px; }
.legend-row span { font-size: 12px; color: var(--dim); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.swatch.g { background: var(--green); }
.swatch.r { background: var(--red); }
.swatch.u { background: #6a7388; }

.log-list .snippet { color: #dce4f0; }
.empty {
  color: var(--dim);
  font-size: 13px;
  padding: 24px 4px;
}

@media (max-width: 1100px) {
  #search { width: min(200px, 40vw); }
  .path { display: none; }
}

  </style>
</head>
<body data-view="global">
  <div class="corners" aria-hidden="true">
    <span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span>
  </div>
  <canvas id="stage" aria-label="OpenCIR Graph: X · AI READER digest graph of lab.lab.x_messages">Graph requires JavaScript.</canvas>
  <div id="hud">

  <script>
/* OpenCIR Graph — shared model, filters, and hash routing (Node + browser). */
(function (root) {
  "use strict";

  var OTHER_COMPANY = "Other";
  var COMPANY_ORDER = ["Anthropic", "Google", "Meta", "Microsoft", "NVIDIA", "X", "xAI", OTHER_COMPANY];
  var COMPANY_COLOR = {
    Anthropic: "#e8a87c",
    Google: "#7ab8ff",
    Meta: "#5aa8ff",
    Microsoft: "#54c4f0",
    NVIDIA: "#8adf00",
    X: "#e7e9ea",
    xAI: "#c6f542"
  };
  COMPANY_COLOR[OTHER_COMPANY] = "#8fa0b8";

  var VIEWS = ["global", "agents", "runs", "rules", "log"];

  function dash(v) {
    if (v == null || v === "") return "—";
    return v;
  }
  function dashNum(v) {
    if (v == null || v === "") return "—";
    return v;
  }
  function formatCount(v) {
    if (v == null || v === "") return "—";
    return Number(v).toLocaleString("en-US");
  }
  function units(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }
  function shortSnippet(text, n) {
    var s = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
    if (!n || s.length <= n) return s;
    return s.slice(0, n - 1) + "…";
  }
  function snippet200(text) {
    var s = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
    if (s.length <= 200) return s;
    return s.slice(0, 200);
  }

  function vancouverParts(iso) {
    if (iso == null || iso === "") return { pretty: "—", offset: "", ymd: "" };
    var d = new Date(iso);
    if (isNaN(d.getTime())) return { pretty: String(iso), offset: "", ymd: "" };
    var pretty = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Vancouver",
      month: "short", day: "numeric", year: "numeric",
      hour: "numeric", minute: "2-digit", hour12: true
    }).format(d);
    var ymdParts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Vancouver",
      year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(d);
    var y = "", m = "", day = "";
    ymdParts.forEach(function (p) {
      if (p.type === "year") y = p.value;
      else if (p.type === "month") m = p.value;
      else if (p.type === "day") day = p.value;
    });
    var ymd = y && m && day ? (y + "-" + m + "-" + day) : "";
    var offset = "";
    var tzPart = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Vancouver", timeZoneName: "shortOffset", hour: "2-digit"
    }).formatToParts(d).find(function (p) { return p.type === "timeZoneName"; });
    if (tzPart && tzPart.value) {
      var mm = tzPart.value.match(/([+-])(\d{1,2})(?::?(\d{2}))?/);
      if (mm) {
        var hh = String(parseInt(mm[2], 10));
        offset = "UTC" + mm[1] + hh + (mm[3] && mm[3] !== "00" ? ":" + mm[3] : "");
      } else offset = tzPart.value;
    }
    return { pretty: pretty, offset: offset, ymd: ymd };
  }

  function formatVancouver(iso, longForm) {
    var p = vancouverParts(iso);
    if (p.pretty === "—") return "—";
    if (longForm) {
      return p.offset
        ? p.pretty + " America/Vancouver (" + p.offset + ")"
        : p.pretty + " America/Vancouver";
    }
    return p.pretty;
  }

  function flagColor(p) {
    if (p.slack_delivered === true || p.is_ai_related === true) return "green";
    if (p.is_ai_related === false) return "red";
    return "grey";
  }

  function assignedCompanyFromMap(companies) {
    if (!companies || !companies.size) return OTHER_COMPANY;
    var best = null, n = -1;
    companies.forEach(function (c, name) {
      if (c > n || (c === n && name < best)) { n = c; best = name; }

    return COMPANY_ORDER.indexOf(best) >= 0 ? best : OTHER_COMPANY;
  }

  function emptyFlags() {
    return { ai: false, notai: false, unclassified: false, delivered: false, models: false };
  }

  function defaultFilters() {
    return {
      flags: emptyFlags(),
      company: "",
      authorQuery: "",
      query: "",
      from: "",
      to: ""
    };
  }

  function flagsActive(flags) {
    return !!(flags && (flags.ai || flags.notai || flags.unclassified || flags.delivered || flags.models));
  }

  function filtersActive(f) {
    if (!f) return false;
    return flagsActive(f.flags) || !!f.company || !!f.authorQuery || !!f.query || !!f.from || !!f.to;
  }

  function matchesPost(post, author, filters) {
    var f = filters || defaultFilters();
    var flags = f.flags || emptyFlags();
    var aiSel = flags.ai || flags.notai || flags.unclassified;
    if (aiSel) {
      var ok = false;
      if (flags.ai && post.is_ai_related === true) ok = true;
      if (flags.notai && post.is_ai_related === false) ok = true;
      if (flags.unclassified && post.is_ai_related !== true && post.is_ai_related !== false) ok = true;
      if (!ok) return false;
    }
    if (flags.delivered && post.slack_delivered !== true) return false;
    if (flags.models && !(post.ai_models && post.ai_models.length)) return false;
    var company = author && author.company ? author.company : OTHER_COMPANY;
    if (f.company && company !== f.company) return false;
    if (f.authorQuery) {
      var aq = String(f.authorQuery).toLowerCase();
      var handle = (post.author_handle || (author && author.handle) || "").toLowerCase();
      var name = (post.author_name || (author && author.name) || "").toLowerCase();
      if (handle.indexOf(aq) < 0 && name.indexOf(aq) < 0) return false;
    }
    if (f.query) {
      var q = String(f.query).toLowerCase();
      var blob = [
        post.author_handle, post.author_name, post.text_snippet, post.company,
        (post.ai_models || []).join(" "), post.post_id, post.post_url
      ].join(" ").toLowerCase();
      if (blob.indexOf(q) < 0) return false;
    }
    if (f.from || f.to) {
      var ymd = vancouverParts(post.created_at).ymd;
      if (!ymd) return false;
      if (f.from && ymd < f.from) return false;
      if (f.to && ymd > f.to) return false;
    }
    return true;
  }

  function buildModel(payload) {
    var posts = (payload && Array.isArray(payload.posts)) ? payload.posts.slice() : [];
    var authorsMap = new Map();
    var minCreated = null, maxCreated = null, latestPost = null;
    var nAI = 0, nNotAI = 0, nNullAI = 0, nDelivered = 0, nHasModels = 0, nFormal = 0, nMetrics = 0, nCompanyNull = 0;
    var modelCounts = new Map();

    posts.forEach(function (p) {
      var key = p.author_id || p.author_handle || "unknown";
      if (!authorsMap.has(key)) {
        authorsMap.set(key, {
          id: key,
          handle: p.author_handle || "unknown",
          name: p.author_name || p.author_handle || "unknown",
          companies: new Map(),
          posts: []
        });
      }
      var a = authorsMap.get(key);
      a.posts.push(p);
      if (p.company) a.companies.set(p.company, (a.companies.get(p.company) || 0) + 1);
      if (p.is_ai_related === true) nAI += 1;
      else if (p.is_ai_related === false) nNotAI += 1;
      else nNullAI += 1;
      if (p.slack_delivered === true) nDelivered += 1;
      if (p.ai_models && p.ai_models.length) {
        nHasModels += 1;
        p.ai_models.forEach(function (m) {
          if (m) modelCounts.set(m, (modelCounts.get(m) || 0) + 1);

      if (p.is_formal_monitor_post === true) nFormal += 1;
      if (p.metrics_present === true) nMetrics += 1;
      if (!p.company) nCompanyNull += 1;
      if (p.created_at) {
        var ts = Date.parse(p.created_at);

        return (Date.parse(y.created_at) || 0) - (Date.parse(x.created_at) || 0);
      });
      a.posts.forEach(function (p) {
        if (p.is_ai_related === true) a.nAI += 1;
        else if (p.is_ai_related === false) a.nNotAI += 1;
        else a.nNullAI += 1;
        if (p.slack_delivered === true) a.nDel += 1;
        if (p.ai_models && p.ai_models.length) a.nModels += 1;
      });
      a.latest = a.posts[0] || null;
      return a;
    }).sort(function (a, b) {
      return b.count - a.count || String(a.handle).localeCompare(String(b.handle));
    });

    var authorsByKey = new Map();
    authorList.forEach(function (a) { authorsByKey.set(a.id, a); });

    var companies = COMPANY_ORDER.map(function (name) {
      var auths = authorList.filter(function (a) { return a.company === name; });
      var plist = [];
      auths.forEach(function (a) { a.posts.forEach(function (p) { plist.push(p); }); });
      var latest = null, latestTs = -1;
      plist.forEach(function (p) {
        var ts = Date.parse(p.created_at) || 0;
        if (ts > latestTs) { latestTs = ts; latest = p; }
      });
      return {
        name: name,
        color: COMPANY_COLOR[name] || "#8fa0b8",
        authors: auths,
        posts: plist,
        authorCount: auths.length,
        postCount: plist.length,
        nAI: plist.filter(function (p) { return p.is_ai_related === true; }).length,
        nNotAI: plist.filter(function (p) { return p.is_ai_related === false; }).length,
        nNullAI: plist.filter(function (p) { return p.is_ai_related !== true && p.is_ai_related !== false; }).length,
        nDel: plist.filter(function (p) { return p.slack_delivered === true; }).length,
        nModels: plist.filter(function (p) { return p.ai_models && p.ai_models.length; }).length,
        latest: latest
      };
    });

    var modelNames = Array.from(modelCounts.keys()).sort(function (a, b) {
      return (modelCounts.get(b) - modelCounts.get(a)) || String(a).localeCompare(String(b));
    });

    var minYmd = minCreated ? vancouverParts(new Date(minCreated).toISOString()).ymd : "";
    var maxYmd = maxCreated ? vancouverParts(new Date(maxCreated).toISOString()).ymd : "";

    return {
      source: (payload && payload.source) || "lab.lab.x_messages",
      row_count: (payload && payload.row_count) || posts.length,
      posts: posts,
      authors: authorList,
      authorsByKey: authorsByKey,
      companies: companies,
      minCreated: minCreated,
      maxCreated: maxCreated,
      minYmd: minYmd,
      maxYmd: maxYmd,
      latestPost: latestPost,
      modelNames: modelNames,
      stats: {
        posts: posts.length,
        authors: authorList.length,
        companies: COMPANY_ORDER.filter(function (c) { return c !== OTHER_COMPANY; }).length,
        models: modelNames.length,
        hasModels: nHasModels,
        modelsNull: posts.length - nHasModels,
        ai: nAI,
        aiRelated: nAI,
        notai: nNotAI,
        aiRelatedFalse: nNotAI,
        nullAI: nNullAI,
        aiRelatedNull: nNullAI,
        delivered: nDelivered,
        slackDelivered: nDelivered,
        slackUnmarked: posts.length - nDelivered,
        formal: nFormal,
        companyNull: nCompanyNull,
        metricsNull: posts.length - nMetrics,
        metricsPresent: nMetrics
      }
    };
  }

  function authorOf(model, post) {
    var key = post.author_id || post.author_handle || "unknown";
    return model.authorsByKey.get(key) || null;
  }

  function filterModel(model, filters) {
    var f = filters || defaultFilters();
    var matched = [];
    var matchIds = new Set();
    model.posts.forEach(function (p) {
      var a = authorOf(model, p);
      if (matchesPost(p, a, f)) {
        matched.push(p);
        matchIds.add(p.post_id);
      }
    });
    var authorIds = new Set();
    var companies = new Set();
    var nAI = 0, nNotAI = 0, nNull = 0, nDel = 0, nModels = 0;
    matched.forEach(function (p) {
      var a = authorOf(model, p);
      if (a) {
        authorIds.add(a.id);
        companies.add(a.company);
      }
      if (p.is_ai_related === true) nAI += 1;
      else if (p.is_ai_related === false) nNotAI += 1;
      else nNull += 1;
      if (p.slack_delivered === true) nDel += 1;
      if (p.ai_models && p.ai_models.length) nModels += 1;
    });
    return {
      posts: matched,
      matchIds: matchIds,
      matchCount: matched.length,
      authorCount: authorIds.size,
      companyCount: companies.size,
      counts: {
        posts: matched.length,
        authors: authorIds.size,
        ai: nAI,
        notai: nNotAI,
        unclassified: nNull,
        delivered: nDel,
        models: nModels
      },
      authorIds: authorIds,
      companies: companies
    };
  }

  // Delivered posts grouped by Vancouver calendar date of created_at.
  // DERIVED: the snapshot has slack_delivered but no delivery timestamp.
  function groupDeliveredByDate(model, filters) {
    var f = filters || defaultFilters();
    var groups = new Map();
    model.posts.forEach(function (p) {
      if (p.slack_delivered !== true) return;
      var a = authorOf(model, p);
      if (!matchesPost(p, a, f)) return;
      var ymd = vancouverParts(p.created_at).ymd || "unknown";
      if (!groups.has(ymd)) groups.set(ymd, { ymd: ymd, posts: [] });
      groups.get(ymd).posts.push(p);
    });
    var rows = Array.from(groups.values()).sort(function (a, b) {
      return a.ymd < b.ymd ? 1 : (a.ymd > b.ymd ? -1 : 0);
    });
    rows.forEach(function (g) {
      g.posts.sort(function (x, y) {
        return (Date.parse(y.created_at) || 0) - (Date.parse(x.created_at) || 0);
      });
      g.count = g.posts.length;
      g.label = g.ymd;
    });
    return rows;
  }

  function parseHash(hash) {
    var raw = String(hash || "").replace(/^#/, "");
    if (raw.charAt(0) === "/") raw = raw.slice(1);
    var view = "global";

    if (ampInPath >= 0) {

      path = path.slice(0, ampInPath);
    }
    path = path.replace(/\/+$/, "");
    if (VIEWS.indexOf(path) >= 0) view = path;

    }
    var params = {};

  function hudInsets() {

  function fitCamera(animate) {

    const bh = Math.max(400, world.h - (world.yMin || 0));

  const webRand = mulberry32(0xA11EAD);

        x: 260 + Math.cos(ang) * rad * 1.35,
        y: 340 + Math.sin(ang) * rad * 0.8,

      }

  function rr(x, y, w0, h0, r) {

    ctx.moveTo(l + rad, t);

    ctx.arcTo(l + rw, t + rh, l, t + rh, rad);

    return {
      x: u*u*u*a.x + 3*u*u*t*c1x + 3*u*t*t*c2x + t*t*t*b.x,

  function dimFactor(n) {
    if (!n) return 1;
    if (n.kind === "company" || n.kind === "author" || n.kind === "post") {

    }
    if (selected) {

      if (sg && n.kind === "post" && n.group === sg) return 1;

    if (n.kind === "post" && n.post && !matchesFilter(n.post)) return 0.12;

    }
    if (state.query && n.kind === "post" && n.post && matchesFilter(n.post)) return 1;

  function nodeAlpha(n, t) {
    if ((n.kind === "author" || n.kind === "post") && !n.placed) return 0;
    const a = appear(n.appearAt || 0, 0.55, t);
    if (t < T.flash - 0.15 && (n.kind === "company" || n.kind === "author" || n.kind === "post" || n.kind === "output" || n.kind === "summary" || n.kind === "log")) {

  function edgeAlpha(e, t) {

  }

    if (flag === "green") return COL.green;

  /* ---------------- scene ---------------- */
  function drawGrid() {
    ctx.fillStyle = COL.bg;

    ctx.scale(cam.k, cam.k);
    ctx.fillStyle = COL.grid;
    const step = 24;
    const x0 = Math.floor(-cam.x / cam.k / step) * step;
    const y0 = Math.floor(-cam.y / cam.k / step) * step;
    const x1 = x0 + (w / cam.k) + step * 2;
    const y1 = y0 + (h / cam.k) + step * 2;
    for (let x = x0; x < x1; x += step) {

    ctx.fillRect(0, 0, w, h);

  function drawWeb(t) {
    const vis = (t < T.flashEnd + 0.6) ? (t < T.flash ? smoothstep(0.05, 0.7, t) : 1 - smoothstep(T.flash, T.flashEnd + 0.45, t)) : 0;
    if (vis <= 0.01) return;

    const col = flagHex(n.flag);
    ctx.globalAlpha = al;
    rr(x, y, n.w, n.h, 4);
    ctx.fillStyle = "#0e1622";
    ctx.fill();
    ctx.strokeStyle = hexAlpha(col, 0.85);
    ctx.lineWidth = 1;
    ctx.stroke();
    // file fold
    ctx.fillStyle = hexAlpha(col, 0.85);
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 3);
    ctx.lineTo(x + 10, y + 3);
    ctx.lineTo(x + 10, y + 7);
    ctx.lineTo(x + 7, y + 7);
    ctx.lineTo(x + 7, y + 15);
    ctx.lineTo(x + 4, y + 15);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = COL.ink;
    ctx.font = "500 10px " + FONT;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(clipText(n.label, ctx.font, n.w - 18), x + 14, n.y + 0.5);
    if (n.post && n.post.slack_delivered === true) {
      ctx.fillStyle = COL.gold;
      ctx.beginPath();
      ctx.arc(x + n.w - 6, n.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOutput(n, al) {
    const x = n.x - n.w / 2, y = n.y - n.h / 2;
    ctx.globalAlpha = al;
    rr(x, y, n.w, n.h, 12);
    ctx.fillStyle = COL.greenDeep;
    ctx.shadowColor = COL.green;
    ctx.shadowBlur = 22;
    ctx.fill();
    ctx.strokeStyle = COL.green;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#e8ffef";
    ctx.font = "700 14px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(n.label, n.x, n.y - 10);
    ctx.fillStyle = COL.green;
    ctx.font = "500 12px " + FONT;
    ctx.fillText(n.sub, n.x, n.y + 12);
    ctx.globalAlpha = 1;
  }

  function drawSummary(n, al) {
    const x = n.x - n.w / 2, y = n.y - n.h / 2;
    ctx.globalAlpha = al;
    rr(x, y, n.w, n.h, 8);
    ctx.fillStyle = "rgba(17,51,38,0.94)";
    ctx.fill();
    ctx.strokeStyle = hexAlpha(COL.green, 0.5);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = "#c8f5dc";
    ctx.font = "600 9.5px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const lines = wrapCanvas(n.label, n.w - 16, ctx.font);
    lines.forEach(function (ln, i) {
      ctx.fillText(ln, n.x, n.y - (lines.length - 1) * 6 + i * 12);
    });
    ctx.globalAlpha = 1;
  }

  function wrapCanvas(text, maxW, font) {
    ctx.font = font;
    const words = String(text).split(" ");
    const lines = [];
    let cur = "";
    words.forEach(function (w0) {
      const t = cur ? cur + " " + w0 : w0;
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w0; }
      else cur = t;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function drawLog(n, al, t) {
    const x = n.x - n.w / 2, y = n.y - n.h / 2;
    ctx.globalAlpha = al;
    rr(x, y, n.w, n.h, 8);
    ctx.fillStyle = "rgba(8,14,24,0.96)";
    ctx.fill();
    ctx.strokeStyle = hexAlpha(COL.cyan, 0.28);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = COL.green;
    ctx.font = "700 8px " + FONT;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("LOG  ·  SNAPSHOT", x + 12, y + 10);
    const typed = appear(n.appearAt, 1.8, t);
    const all = n.lines.join("\n");
    const nChars = Math.floor(all.length * typed);
    let shown = all.slice(0, nChars);
    if (typed < 1 && (Math.floor(t * 6) % 2 === 0)) shown += "▍";
    const rawLines = shown.split("\n");
    let yL = y + 26;
    rawLines.forEach(function (ln) {
      const color = ln.indexOf("RUN COMPLETE") === 0 ? COL.green : (ln.indexOf("SNAPSHOT") === 0 ? COL.cyan : "#c9d8ea");
      ctx.fillStyle = color;
      ctx.font = "500 10px " + FONT;
      const wrapped = wrapCanvas((ln ? "> " + ln : ">"), n.w - 22, ctx.font);
      wrapped.forEach(function (wln) {
        ctx.fillText(wln, x + 12, yL);
        yL += 16;
      });
    });
    ctx.globalAlpha = 1;
  }

  function drawMoreChips(t) {
    // "+N" markers already represented as company.more text under authors of each block — draw under last placed author of a company
    groups.forEach(function (g) {
      const cn = nodeById.get("co:" + g.name);
      if (!cn.more) return;
      const al = nodeAlpha(cn, t);
      if (al < 0.05) return;
      // find lowest placed author/post in group
      let maxY = -1e9, x = L.authorX;
      nodes.forEach(function (n) {
        if ((n.kind === "author" || n.kind === "post") && n.placed && n.group === g.name) {
          if (n.y + (n.h || 0) / 2 > maxY) { maxY = n.y + (n.h || 0) / 2; x = n.kind === "post" ? n.x : L.authorX; }
        }
      });
      if (maxY < 0) return;
      ctx.save();
      ctx.translate(cam.x, cam.y);
      ctx.scale(cam.k, cam.k);
      ctx.globalAlpha = al * 0.9;
      ctx.fillStyle = COL.mute;
      ctx.font = "500 9px " + FONT;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(cn.more, L.authorX - 70, maxY + 6);
      ctx.restore();
    });
  }

  function drawNodes(t) {
    ctx.save();
    ctx.translate(cam.x, cam.y);
    ctx.scale(cam.k, cam.k);
    const order = ["input", "check", "splitter", "company", "author", "post", "hub", "output", "summary", "log"];
    order.forEach(function (kind) {
      nodes.forEach(function (n) {
        if (n.kind !== kind) return;
        const al = nodeAlpha(n, t);
        if (al < 0.02) return;
        if (kind === "input") drawInput(n, al);
        else if (kind === "hub") drawHub(n, al, t);
        else if (kind === "check" || kind === "splitter") drawLogic(n, al);
        else if (kind === "company") drawCompany(n, al);
        else if (kind === "author") drawAuthor(n, al);
        else if (kind === "post") drawPost(n, al);
        else if (kind === "output") drawOutput(n, al);
        else if (kind === "summary") drawSummary(n, al);
        else if (kind === "log") drawLog(n, al, t);
      });
    });
    ctx.restore();
    drawMoreChips(t);
  }

  /* ---------------- HUD counters / status ---------------- */
  function tweenCount(target, t) {
    const u = reducedMotion ? 1 : easeOut(smoothstep(3.8, 9.5, t));
    return Math.round(target * u);
  }
  function updateHUD(t) {
    const filtered = C.filterModel(model, filterState);
    const active = C.filtersActive(filterState);
    const use = active ? filtered.counts : {
      posts: STATS.posts, authors: STATS.authors, ai: STATS.ai,
      notai: STATS.notai, delivered: STATS.delivered, models: STATS.models
    };
    const show = function (n) { return String(active ? n : tweenCount(n, t)); };
    if (statEls.posts) statEls.posts.textContent = show(use.posts);
    if (statEls.authors) statEls.authors.textContent = show(use.authors);
    if (statEls.ai) statEls.ai.textContent = show(use.ai);
    if (statEls.notai) statEls.notai.textContent = show(use.notai);
    if (statEls.delivered) statEls.delivered.textContent = show(use.delivered);
    if (statEls.models) statEls.models.textContent = show(use.models);

    if (showingEl) {
      showingEl.textContent = filtered.matchCount + " of " + STATS.posts + " shown" +
        (state.view === "global" ? (state.expanded ? " · expanded" : " · collapsed") : "") +
        " · SNAPSHOT";
    }
    const note = document.getElementById("filter-note");
    if (note) {
      note.textContent = active
        ? ("Filters on · chips show matching counts · snapshot totals: " +
           STATS.posts + " posts, " + STATS.authors + " authors, " +
           STATS.ai + " AI-related, " + STATS.notai + " not AI, " +
           STATS.delivered + " delivered")
        : "";
    }
    if (statusEl) {
      if (state.view !== "global") statusEl.textContent = "OpenCIR Graph · " + state.view;
      else if (t < 1.2) statusEl.textContent = "Building graph…";
      else if (t < T.flash) statusEl.textContent = "Check first → split by company";
      else if (t < T.out) statusEl.textContent = "Units unfolding";
      else statusEl.textContent = "SNAPSHOT · " + STATS.posts + " posts · " + (DATA.source || "lab.lab.x_messages");
    }
    if (collapseBtn) collapseBtn.textContent = state.expanded ? "Collapse posts" : "Expand posts";
  }

  /* ---------------- hit testing ---------------- */
  function hitNode(sx, sy) {
    const p = toWorld(sx, sy);
    // topmost first: posts, authors, companies, logic, hub, inputs, output
    const kinds = ["post", "author", "company", "check", "splitter", "hub", "input", "output", "log", "summary"];
    for (let k = 0; k < kinds.length; k++) {
      for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        if (n.kind !== kinds[k]) continue;
        if ((n.kind === "author" || n.kind === "post") && !n.placed) continue;
        if (n.kind === "hub") {
          const dx = p.x - n.x, dy = p.y - n.y;
          if (dx * dx + dy * dy <= (n.r + 8) * (n.r + 8)) return n;
        } else {
          const hw = (n.w || 20) / 2, hh = (n.h || 16) / 2;
          if (p.x >= n.x - hw && p.x <= n.x + hw && p.y >= n.y - hh && p.y <= n.y + hh) return n;
        }
      }
    }
    return null;
  }

  function hitToggle(sx, sy) {
    const p = toWorld(sx, sy);
    const list = nodes.filter(function (n) { return n.kind === "company" || n.kind === "check" || n.kind === "splitter"; });
    for (let i = 0; i < list.length; i++) {
      const n = list[i];
      const tb = n._toggle;
      if (!tb) continue;
      if (p.x >= tb.x && p.x <= tb.x + tb.w && p.y >= tb.y && p.y <= tb.y + tb.h) return n;
    }
    return null;
  }

  function showTip(n, sx, sy) {
    if (!n || !tooltip) { if (tooltip) tooltip.hidden = true; return; }
    let html = "";
    if (n.kind === "post" && n.post) {
      const p = n.post;
      const a = n.author;
      html += "<div class='k'>POST · " + esc(flagColor(p).toUpperCase()) + (p.slack_delivered === true ? " · DELIVERED" : "") + "</div>";
      html += "<div class='t'>@" + esc(p.author_handle || "unknown") + (p.author_name && p.author_name !== p.author_handle ? " · " + esc(p.author_name) : "") + "</div>";
      html += "<div class='when'>" + esc(vancouverLabel(p.created_at)) + "</div>";
      html += "<div class='tx'>" + esc(snippet200(p.text_snippet)) + (p.text_truncated ? "…" : "") + "</div>";
      html += "<div class='metrics'>" +
        metric("likes", p.like_count) +
        metric("rts", p.retweet_count) +
        metric("replies", p.reply_count) +
        metric("quotes", p.quote_count) +
        metric("bookmarks", p.bookmark_count) +
        metric("impressions", p.impression_count) +
        metric("engagement", p.engagement) +
        "</div>";
      const bits = [];
      bits.push(p.is_ai_related === true ? "AI-related" : p.is_ai_related === false ? "not AI-related" : "AI-related unclassified");
      bits.push(p.slack_delivered === true ? "delivered to Slack" : "not delivered");
      bits.push(p.company ? ("company " + p.company) : "company —");
      if (a && a.company && a.company !== p.company) bits.push("grouped under " + a.company);
      if (p.ai_models && p.ai_models.length) bits.push("models: " + p.ai_models.join(", "));
      html += "<div class='s'>" + esc(bits.join(" · ")) + "</div>";
    } else if (n.kind === "company") {
      const g = groups.find(function (x) { return x.name === n.group; });
      html += "<div class='k'>UNIT · COMPANY</div>";
      html += "<div class='t'>" + esc(n.label) + "</div>";
      html += "<div class='s'>" + esc(n.sub + " · " + n.meta) + (n.group === "Other" ? ". Authors with no labeled company, plus any leftover." : "") + "</div>";
      if (g) {
        const tops = g.authors.slice(0, 6).map(function (a) { return "@" + a.handle + " (" + a.count + ")"; }).join(", ");
        html += "<div class='s'>" + esc(tops) + (g.authors.length > 6 ? "…" : "") + "</div>";
      }
    } else if (n.kind === "author") {
      const a = n.author;
      html += "<div class='k'>AUTHOR" + (n.isTop ? " · TOP" : "") + "</div>";
      html += "<div class='t'>@" + esc(a.handle) + "</div>";
      html += "<div class='s'>" + esc(a.name) + " · " + a.count + " posts · grouped under " + esc(a.company) + "</div>";
    } else if (n.kind === "hub") {
      html += "<div class='k'>PIPELINE</div><div class='t'>X · AI READER</div><div class='s'>DIGEST · " + esc(DATA.source || "lab.lab.x_messages") + " · " + STATS.posts + " posts snapshot</div>";
    } else if (n.kind === "output") {
      html += "<div class='k'>OUTPUT</div><div class='t'>DIGEST DELIVERED</div><div class='s'>" + STATS.delivered + " posts with slack_delivered = true (of " + STATS.posts + ")</div>";
    } else if (n.kind === "check" || n.kind === "splitter") {
      html += "<div class='k'>STAGE</div><div class='t'>" + esc(n.label) + "</div><div class='s'>" + esc(n.sub) + " — " + esc(n.detail) + "</div>";
    } else if (n.kind === "input") {
      html += "<div class='k'>INPUT</div><div class='t'>" + esc(n.label) + "</div><div class='s'>" + esc(n.sub) + "</div>";
    } else {
      tooltip.hidden = true; return;
    }
    tooltip.innerHTML = html;
    tooltip.hidden = false;
    placeTip(sx, sy);
  }
  function metric(lbl, v) {
    return "<span class='m'><em>" + esc(lbl) + "</em> " + esc(fmtNum(v)) + "</span>";
  }
  function placeTip(sx, sy) {
    const pad = 14;
    const tw = tooltip.offsetWidth || 360, th = tooltip.offsetHeight || 160;
    let x = sx + 18, y = sy + 16;
    if (x + tw > w - pad) x = sx - tw - 12;
    if (y + th > h - pad) y = sy - th - 12;
    x = clamp(x, pad, Math.max(pad, w - tw - pad));
    y = clamp(y, pad, Math.max(pad, h - th - pad));
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  /* ---------------- loop ---------------- */
  function resize() {
    const rect = canvas.getBoundingClientRect();
    w = Math.max(1, Math.floor(window.innerWidth));
    h = Math.max(1, Math.floor(window.innerHeight));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!userCam) {
      if (shotMode === "start" || clock < T.flash) applyIntroCamera();
      else fitCamera(false);
    }
    renderFrame();
  }

  function tick(now) {
    if (!startTime) startTime = now;
    if (!paused) clock = (now - startTime) / 1000;
    if (reducedMotion && !paused) clock = T.done;

    // ease camera toward target
    cam.x = lerp(cam.x, cam.tx, 0.18);
    cam.y = lerp(cam.y, cam.ty, 0.18);
    cam.k = lerp(cam.k, cam.tk, 0.18);

    // cinematic camera: start zoomed on left, after flash fit full
    if (!userCam && !shotMode) {
      if (clock < T.flash) applyIntroCamera();
      else fitCamera(true);
    }

    renderFrame();
    frame = requestAnimationFrame(tick);
  }

  function renderFrame() {
    if (w < 2 || h < 2) return;
    drawGrid();
    drawWeb(clock);
    drawEdges(clock);
    drawParticles(clock);
    drawNodes(clock);
    drawFlash(clock);
    // fade under the HUD so the mesh doesn't fight the nav
    const fade = ctx.createLinearGradient(0, 0, 0, 114);
    fade.addColorStop(0, "rgba(7,11,18,0.96)");
    fade.addColorStop(0.7, "rgba(7,11,18,0.55)");
    fade.addColorStop(1, "rgba(7,11,18,0)");
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, w, 116);
    const fadeB = ctx.createLinearGradient(0, h - 42, 0, h);
    fadeB.addColorStop(0, "rgba(7,11,18,0)");
    fadeB.addColorStop(1, "rgba(7,11,18,0.85)");
    ctx.fillStyle = fadeB;
    ctx.fillRect(0, h - 42, w, 42);
    updateHUD(clock);
    document.body.dataset.ready = "1";
    document.body.dataset.t = String(clock.toFixed(2));
  }

  let userCam = false;
  let shotMode = null;

  function replay() {
    cancelAnimationFrame(frame);
    startTime = 0;
    clock = 0;
    paused = false;
    userCam = false;
    selected = null;
    if (tooltip) tooltip.hidden = true;
    if (!reducedMotion) applyIntroCamera();
    else fitCamera(false);
    frame = requestAnimationFrame(tick);
  }

  /* ---------------- events ---------------- */
  canvas.addEventListener("pointerdown", function (e) {
    const r = canvas.getBoundingClientRect();
    lastPX = e.clientX - r.left; lastPY = e.clientY - r.top;
    dragging = true; dragMoved = false;
    userCam = true;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    if (dragging) {
      const dx = sx - lastPX, dy = sy - lastPY;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
      cam.x += dx; cam.y += dy; cam.tx = cam.x; cam.ty = cam.y;
      lastPX = sx; lastPY = sy;
    } else {
      const n = hitNode(sx, sy);
      hover = n;
      canvas.style.cursor = n ? "pointer" : "grab";
      showTip(n && (n.kind === "post" || n.kind === "author" || n.kind === "company" || n.kind === "hub" || n.kind === "output" || n.kind === "check" || n.kind === "splitter" || n.kind === "input") ? n : null, sx, sy);
    }
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!dragMoved) {
      const r = canvas.getBoundingClientRect();
      const sx = e.clientX - r.left, sy = e.clientY - r.top;
      const tog = hitToggle(sx, sy);
      if (tog) {
        if (tog.kind === "check") state.checkOn = !state.checkOn;
        else if (tog.kind === "splitter") state.splitterOn = !state.splitterOn;
        else if (tog.kind === "company") {
          state.enabled[tog.group] = !groupEnabled(tog.group);
        }
        return;
      }
      const n = hitNode(sx, sy);
      if (n && (n.kind === "company" || n.kind === "author" || n.kind === "post")) {
        selected = (selected && selected.id === n.id) ? null : n;
        if (n.kind === "author" || n.kind === "post") selected = nodeById.get("co:" + n.group) || n;
      } else if (n && n.kind === "hub") {
        replay();
      } else {
        selected = null;
      }
    }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", function () {
    if (!dragging) { hover = null; if (tooltip) tooltip.hidden = true; }
  });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    userCam = true;
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomAt(sx, sy, factor);
  }, { passive: false });

  if (replayBtn) replayBtn.addEventListener("click", replay);
  if (collapseBtn) collapseBtn.addEventListener("click", function () {
    state.expanded = !state.expanded;
    relayout();
    userCam = false;
    fitCamera(true);
  });
  window.addEventListener("resize", function () { resize(); layoutChrome(); });

  /* ---- views, filters, and hash routing are installed below ---- */

  /* ---------------- shot / seek API for verification ---------------- */
  function seek(t, pause) {
    reducedMotion = false;
    startTime = performance.now() - t * 1000;
    clock = t;
    paused = !!pause;
    userCam = false;
    if (t >= T.flash) fitCamera(false);
    else applyIntroCamera();
    renderFrame();
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(tick);
  }
  window.__seek = seek;
  window.__STATS = STATS;

  /* ---------------- views + hash routing ---------------- */

  function layoutChrome() {
    const chrome = document.getElementById("hud");
    const panel = document.getElementById("view-panel");
    if (!chrome || !panel) return;
    const nav = chrome.querySelector(".nav");
    const bar = chrome.querySelector(".toolbar");
    const top = (bar ? bar.getBoundingClientRect().bottom : (nav ? nav.getBoundingClientRect().bottom : 148)) + 4;
    panel.style.top = Math.max(110, Math.round(top)) + "px";
  }

  let agentsSort = { companies: { key: "posts", dir: -1 }, authors: { key: "posts", dir: -1 } };
  let logSort = { key: "created", dir: -1 };

  function currentHash() {
    return C.serializeHash(state.view, filterState, state.highlight);
  }
  function writeHash() {
    const h = currentHash();
    if (location.hash === h) return;
    syncingHash = true;
    location.hash = h;
    setTimeout(function () { syncingHash = false; }, 0);
  }
  function applyHash(hash) {
    const parsed = C.parseHash(hash || location.hash);
    filterState = parsed.filters;
    state.highlight = parsed.highlight || "";
    syncFilterControls();
    setView(parsed.view, state.highlight, true);
  }

  function syncFilterControls() {
    const f = filterState;
    document.querySelectorAll("#filters [data-filter]").forEach(function (btn) {
      const key = btn.getAttribute("data-filter");
      btn.classList.toggle("on", !!f.flags[key]);
      btn.setAttribute("aria-pressed", f.flags[key] ? "true" : "false");
    });
    const search = document.getElementById("search");
    const author = document.getElementById("author-search");
    const company = document.getElementById("filter-company");
    const from = document.getElementById("filter-from");
    const to = document.getElementById("filter-to");
    if (search && search.value !== f.query) search.value = f.query;
    if (author && author.value !== f.authorQuery) author.value = f.authorQuery;
    if (company && company.value !== f.company) company.value = f.company;
    if (from && from.value !== f.from) from.value = f.from;
    if (to && to.value !== f.to) to.value = f.to;
  }

  function filtersChanged() {
    writeHash();
    if (state.view !== "global") renderCurrentView();
    updateHUD(clock);
  }

  function setView(view, highlight, fromHash) {
    const v = C.VIEWS.indexOf(view) >= 0 ? view : "global";
    state.view = v;
    if (highlight != null) state.highlight = highlight;
    document.body.setAttribute("data-view", v);
    document.querySelectorAll(".tabs [data-view]").forEach(function (el) {
      const on = el.getAttribute("data-view") === v;
      el.classList.toggle("on", on);
      el.setAttribute("aria-selected", on ? "true" : "false");
      el.setAttribute("tabindex", on ? "0" : "-1");
    });
    const path = document.getElementById("view-path");
    if (path) path.textContent = v;
    document.querySelectorAll("#view-panel .view-sec").forEach(function (sec) {
      sec.hidden = sec.id !== ("view-" + v);
    });
    if (v !== "global") renderCurrentView();
    if (v === "global" && state.highlight) applyHighlight(state.highlight);
    layoutChrome();
    if (!fromHash) writeHash();
    updateHUD(clock);
  }

  function applyHighlight(hl) {
    if (!hl) { selected = null; return; }
    let n = nodeById.get(hl);
    if (!n && hl.indexOf("co:") === 0) n = nodeById.get(hl);
    if (!n && hl.indexOf("au:") === 0) n = nodeById.get(hl);
    if (!n) return;
    if ((n.kind === "author" || n.kind === "post") && !n.placed) {
      state.expanded = true;
      relayout();
    }
    selected = (n.kind === "author" || n.kind === "post") ? (nodeById.get("co:" + n.group) || n) : n;
    if (n.x != null) {
      userCam = true;
      const k = Math.max(cam.k, 0.9);
      cam.tk = k;
      cam.tx = w / 2 - n.x * k;
      cam.ty = h / 2 - n.y * k;
    }
  }

  function openGlobalHighlight(hl) {
    state.highlight = hl || "";
    setView("global", state.highlight, false);
    applyHighlight(state.highlight);
  }

  function sortRows(rows, spec, getter) {
    const dir = spec.dir;
    const key = spec.key;
    return rows.slice().sort(function (a, b) {
      const va = getter(a, key), vb = getter(b, key);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
      return String(va).localeCompare(String(vb)) * dir;
    });
  }
  function toggleSort(store, key) {
    if (store.key === key) store.dir = -store.dir;
    else { store.key = key; store.dir = key === "name" || key === "handle" || key === "latest" ? 1 : -1; }
  }
  function sortAttr(store, key) {
    if (store.key !== key) return "none";
    return store.dir === 1 ? "ascending" : "descending";
  }
  function latestCell(post) {
    if (!post) return "—";
    return esc(C.formatVancouver(post.created_at, false));
  }

  function renderAgents() {
    const root = document.getElementById("view-agents");
    if (!root) return;
    const filtered = C.filterModel(model, filterState);
    const ids = filtered.matchIds;
    function countsForPosts(plist) {
      let n = 0, ai = 0, del = 0, models = 0, latest = null, lt = -1;
      plist.forEach(function (p) {
        if (!ids.has(p.post_id)) return;
        n += 1;
        if (p.is_ai_related === true) ai += 1;
        if (p.slack_delivered === true) del += 1;
        if (p.ai_models && p.ai_models.length) models += 1;
        const ts = Date.parse(p.created_at) || 0;
        if (ts > lt) { lt = ts; latest = p; }
      });
      return { n: n, ai: ai, del: del, models: models, latest: latest };
    }
    const companies = model.companies.map(function (c) {
      const ct = countsForPosts(c.posts);
      return { c: c, n: ct.n, ai: ct.ai, del: ct.del, models: ct.models, latest: ct.latest };
    }).filter(function (r) { return !C.filtersActive(filterState) || r.n > 0; });
    const authors = model.authors.map(function (a) {
      const ct = countsForPosts(a.posts);
      return { a: a, n: ct.n, ai: ct.ai, del: ct.del, models: ct.models, latest: ct.latest };
    }).filter(function (r) { return !C.filtersActive(filterState) || r.n > 0; });

    const cs = sortRows(companies, agentsSort.companies, function (r, k) {
      if (k === "name") return r.c.name;
      if (k === "posts") return r.n;
      if (k === "ai") return r.ai;
      if (k === "delivered") return r.del;
      if (k === "models") return r.models;
      if (k === "latest") return r.latest ? Date.parse(r.latest.created_at) : 0;
      return 0;
    });
    const as = sortRows(authors, agentsSort.authors, function (r, k) {
      if (k === "handle") return r.a.handle;
      if (k === "name") return r.a.name;
      if (k === "company") return r.a.company;
      if (k === "posts") return r.n;
      if (k === "ai") return r.ai;
      if (k === "delivered") return r.del;
      if (k === "models") return r.models;
      if (k === "latest") return r.latest ? Date.parse(r.latest.created_at) : 0;
      return 0;
    });

    function th(store, key, label, cls) {
      return "<th class='" + (cls || "") + "' data-sort='" + key + "' aria-sort='" + sortAttr(store, key) + "'>" + label + "</th>";
    }
    let html = "<h1>Agents</h1>";
    html += "<p class='lede'>Company groups and authors in this snapshot. Authors are placed under any labeled company on their posts, or Other if none — a derived grouping, not a field on every row. Counts follow the current filters. Click a row to open Global with that branch highlighted.</p>";
    html += "<h2>Companies</h2>";
    html += "<table class='data-table' id='company-table'><thead><tr>";
    html += th(agentsSort.companies, "name", "Company");
    html += th(agentsSort.companies, "posts", "Posts", "num");
    html += th(agentsSort.companies, "ai", "AI-related", "num");
    html += th(agentsSort.companies, "delivered", "Delivered", "num");
    html += th(agentsSort.companies, "models", "Has models", "num");
    html += th(agentsSort.companies, "latest", "Latest post");
    html += "</tr></thead><tbody>";
    cs.forEach(function (r) {
      html += "<tr data-hl='co:" + esc(r.c.name) + "'>";
      html += "<td>" + esc(r.c.name) + "</td>";
      html += "<td class='num'>" + r.n + "</td>";
      html += "<td class='num'>" + r.ai + "</td>";
      html += "<td class='num'>" + r.del + "</td>";
      html += "<td class='num'>" + r.models + "</td>";
      html += "<td class='muted'>" + latestCell(r.latest) + "</td></tr>";
    });
    if (!cs.length) html += "<tr><td colspan='6' class='muted'>No companies match the current filters.</td></tr>";
    html += "</tbody></table>";
    html += "<h2>Authors</h2>";
    html += "<table class='data-table' id='author-table'><thead><tr>";
    html += th(agentsSort.authors, "handle", "Handle");
    html += th(agentsSort.authors, "name", "Name");
    html += th(agentsSort.authors, "company", "Company");
    html += th(agentsSort.authors, "posts", "Posts", "num");
    html += th(agentsSort.authors, "ai", "AI-related", "num");
    html += th(agentsSort.authors, "delivered", "Delivered", "num");
    html += th(agentsSort.authors, "models", "Has models", "num");
    html += th(agentsSort.authors, "latest", "Latest post");
    html += "</tr></thead><tbody>";
    as.forEach(function (r) {
      html += "<tr data-hl='au:" + esc(r.a.id) + "'>";
      html += "<td>@" + esc(r.a.handle) + "</td>";
      html += "<td>" + esc(r.a.name) + "</td>";
      html += "<td>" + esc(r.a.company) + "</td>";
      html += "<td class='num'>" + r.n + "</td>";
      html += "<td class='num'>" + r.ai + "</td>";
      html += "<td class='num'>" + r.del + "</td>";
      html += "<td class='num'>" + r.models + "</td>";
      html += "<td class='muted'>" + latestCell(r.latest) + "</td></tr>";
    });
    if (!as.length) html += "<tr><td colspan='8' class='muted'>No authors match the current filters.</td></tr>";
    html += "</tbody></table>";
    root.innerHTML = html;

    root.querySelectorAll("#company-table th[data-sort]").forEach(function (thEl) {
      thEl.addEventListener("click", function () {
        toggleSort(agentsSort.companies, thEl.getAttribute("data-sort"));
        renderAgents();
      });
    });
    root.querySelectorAll("#author-table th[data-sort]").forEach(function (thEl) {
      thEl.addEventListener("click", function () {
        toggleSort(agentsSort.authors, thEl.getAttribute("data-sort"));
        renderAgents();
      });
    });
    root.querySelectorAll("tbody tr[data-hl]").forEach(function (tr) {
      tr.addEventListener("click", function () { openGlobalHighlight(tr.getAttribute("data-hl")); });
      tr.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGlobalHighlight(tr.getAttribute("data-hl")); }
      });
      tr.tabIndex = 0;
    });
  }

  function postBadges(p) {
    var bits = [];
    if (p.is_ai_related === true) bits.push("<span class='badge-ai'>AI-related</span>");
    else if (p.is_ai_related === false) bits.push("<span class='badge-no'>Not AI</span>");
    else bits.push("<span class='badge-unk'>Unclassified</span>");
    if (p.slack_delivered === true) bits.push("<span class='badge-del'>Delivered</span>");
    if (p.ai_models && p.ai_models.length) bits.push("<span class='badge-model'>" + esc(p.ai_models.join(", ")) + "</span>");
    return bits.join(" ");
  }
  function postLink(p) {
    if (!p.post_url) return "—";
    return "<a class='post-link' href='" + esc(p.post_url) + "' target='_blank' rel='noopener noreferrer'>Open post</a>";
  }

  function renderRuns() {
    const root = document.getElementById("view-runs");
    if (!root) return;
    const groups = C.groupDeliveredByDate(model, filterState);
    const total = groups.reduce(function (n, g) { return n + g.count; }, 0);
    const win = (model.minCreated ? C.formatVancouver(new Date(model.minCreated).toISOString(), true) : "—") +
      "  →  " + (model.maxCreated ? C.formatVancouver(new Date(model.maxCreated).toISOString(), true) : "—");
    let html = "<h1>Runs</h1>";
    html += "<p class='lede'>Slack-delivered posts in this snapshot, grouped for reading.</p>";
    html += "<p class='derived'>Derived view — not a recorded run log. The snapshot has a slack_delivered flag but no run id, duration, status, or delivery timestamp. Groups use each post’s created_at calendar date in America/Vancouver. " +
      total + " of the 24 delivered posts match the current filters. Window of all 117 posts in the snapshot: " + esc(win) + ".</p>";
    if (!groups.length) {
      html += "<p class='empty'>No delivered posts match the current filters.</p>";
    }
    groups.forEach(function (g) {
      const label = g.posts[0] ? C.formatVancouver(g.posts[0].created_at, false).replace(/, \d{1,2}:\d{2}\s*[AP]M/, "") : g.ymd;
      html += "<div class='run-card'>";
      html += "<h3>" + esc(label) + "</h3>";
      html += "<div class='meta'>" + C.units(g.count, "delivered post") + " · grouped by created date (America/Vancouver) · " + esc(g.ymd) + "</div>";
      html += "<table class='data-table'><thead><tr><th>Time</th><th>Author</th><th>Snippet</th><th></th></tr></thead><tbody>";
      g.posts.forEach(function (p) {
        html += "<tr>";
        html += "<td class='muted'>" + esc(C.formatVancouver(p.created_at, true)) + "</td>";
        html += "<td>@" + esc(p.author_handle || "unknown") + "</td>";
        html += "<td class='snippet'>" + esc(C.shortSnippet(p.text_snippet, 160)) + "</td>";
        html += "<td>" + postLink(p) + "</td></tr>";
      });
      html += "</tbody></table></div>";
    });
    root.innerHTML = html;
  }

  function renderRules() {
    const root = document.getElementById("view-rules");
    if (!root) return;
    root.innerHTML = [
      "<h1>Rules</h1>",
      "<p class='lede'>Editorial rules actually used by the X digest workflow, plus the color legend for this snapshot graph. This page is static reference text, not a live rules engine.</p>",
      "<article>",
      "<h2>Digest workflow</h2>",
      "<ol>",
      "<li>Collect every post from the 36 roster accounts. This snapshot contains 56 distinct authors because replies, quotes, and related handles also appear in stored posts.</li>",
      "<li>Every collected post can be stored in <code>lab.lab.x_messages</code>. Only AI-relevant posts go into the Slack digest.</li>",
      "<li>Politics and general-company noise are editorially excluded from the digest. Excluded posts can still remain in the table.</li>",
      "<li>Each digest edition is posted in English first, then Simplified Chinese, to Slack #grok (private channel).</li>",
      "<li>Rows are inserted idempotently into the Databricks table <code>lab.lab.x_messages</code>.</li>",
      "</ol>",
      "<h2>How to read this graph</h2>",
      "<div class='legend-row'>",
      "<span><i class='swatch g'></i>Green: AI-related or Slack-delivered</span>",
      "<span><i class='swatch r'></i>Red: not AI-related</span>",
      "<span><i class='swatch u'></i>Grey: unclassified (null flag)</span>",
      "</div>",
      "<ul>",
      "<li>Null metrics, companies, and models are shown as — and are never treated as 0.</li>",
      "<li>Authors in this visualization are grouped by any labeled company on their posts, or Other if none. That grouping is derived. 84 posts in the snapshot have no company field. Jensen Huang is under Microsoft because that is the only company tag on his posts.</li>",
      "<li>The 24 “delivered” posts are those with slack_delivered = true. This snapshot does not include delivery timestamps or run identifiers.</li>",
      "</ul>",
      "</article>"
    ].join("");
  }

  function renderLog() {
    const root = document.getElementById("view-log");
    if (!root) return;
    const filtered = C.filterModel(model, filterState);
    const rows = sortRows(filtered.posts, logSort, function (p, k) {
      if (k === "created") return Date.parse(p.created_at) || 0;
      if (k === "author") return p.author_handle || "";
      if (k === "ai") return String(p.is_ai_related);
      if (k === "delivered") return p.slack_delivered === true ? 1 : 0;
      return 0;
    });
    let html = "<h1>Log</h1>";
    html += "<p class='lede'>All posts in this snapshot that match the current filters. Times are America/Vancouver. " +
      rows.length + " of " + STATS.posts + " shown.</p>";
    html += "<table class='data-table' id='log-table'><thead><tr>";
    html += "<th data-sort='created' aria-sort='" + sortAttr(logSort, "created") + "'>Time</th>";
    html += "<th data-sort='author' aria-sort='" + sortAttr(logSort, "author") + "'>Author</th>";
    html += "<th>Snippet</th>";
    html += "<th data-sort='ai' aria-sort='" + sortAttr(logSort, "ai") + "'>Flags</th>";
    html += "<th>Link</th></tr></thead><tbody>";
    rows.forEach(function (p) {
      html += "<tr>";
      html += "<td class='muted' style='white-space:nowrap'>" + esc(C.formatVancouver(p.created_at, true)) + "</td>";
      html += "<td>@" + esc(p.author_handle || "unknown") +
        (p.author_name && p.author_name !== p.author_handle ? "<div class='muted'>" + esc(p.author_name) + "</div>" : "") + "</td>";
      html += "<td class='snippet'>" + esc(C.shortSnippet(p.text_snippet, 200)) + "</td>";
      html += "<td>" + postBadges(p) + "</td>";
      html += "<td>" + postLink(p) + "</td></tr>";
    });
    if (!rows.length) html += "<tr><td colspan='5' class='muted'>No posts match the current filters.</td></tr>";
    html += "</tbody></table>";
    root.innerHTML = html;
    root.querySelectorAll("#log-table th[data-sort]").forEach(function (thEl) {
      thEl.addEventListener("click", function () {
        toggleSort(logSort, thEl.getAttribute("data-sort"));
        renderLog();
      });
    });
  }

  function renderCurrentView() {
    if (state.view === "agents") renderAgents();
    else if (state.view === "runs") renderRuns();
    else if (state.view === "rules") renderRules();
    else if (state.view === "log") renderLog();
  }

  function initRouter() {
    const from = document.getElementById("filter-from");
    const to = document.getElementById("filter-to");
    if (from) { from.min = model.minYmd; from.max = model.maxYmd; }
    if (to) { to.min = model.minYmd; to.max = model.maxYmd; }
    const company = document.getElementById("filter-company");
    if (company && !company.options.length) {
      const all = document.createElement("option");
      all.value = ""; all.textContent = "All companies";
      company.appendChild(all);
      COMPANY_ORDER.forEach(function (name) {
        const o = document.createElement("option");
        o.value = name; o.textContent = name;
        company.appendChild(o);
      });
    }

    document.querySelectorAll(".tabs [data-view]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.preventDefault();
        setView(el.getAttribute("data-view"), state.highlight, false);
        el.focus();
      });
    });
    const tablist = document.querySelector(".tabs");
    if (tablist) {
      tablist.addEventListener("keydown", function (e) {
        const tabs = Array.from(tablist.querySelectorAll("[data-view]"));
        const i = tabs.indexOf(document.activeElement);
        if (i < 0) return;
        let n = -1;
        if (e.key === "ArrowRight") n = (i + 1) % tabs.length;
        else if (e.key === "ArrowLeft") n = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === "Home") n = 0;
        else if (e.key === "End") n = tabs.length - 1;
        if (n >= 0) {
          e.preventDefault();
          tabs[n].focus();
          setView(tabs[n].getAttribute("data-view"), state.highlight, false);
        }
      });
    }

    const search = document.getElementById("search");
    const author = document.getElementById("author-search");
    if (search) search.addEventListener("input", function () {
      filterState.query = search.value.trim();
      filtersChanged();
    });
    if (author) author.addEventListener("input", function () {
      filterState.authorQuery = author.value.trim();
      filtersChanged();
    });
    if (company) company.addEventListener("change", function () {
      filterState.company = company.value;
      filtersChanged();
    });
    if (from) from.addEventListener("change", function () {
      filterState.from = from.value;
      filtersChanged();
    });
    if (to) to.addEventListener("change", function () {
      filterState.to = to.value;
      filtersChanged();
    });
    const filtersEl = document.getElementById("filters");
    if (filtersEl) {
      filtersEl.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        const key = btn.getAttribute("data-filter");
        if (!Object.prototype.hasOwnProperty.call(filterState.flags, key)) return;
        filterState.flags[key] = !filterState.flags[key];
        filtersChanged();
      });
    }
    const clear = document.getElementById("clear-filters");
    if (clear) clear.addEventListener("click", function () {
      filterState = C.defaultFilters();
      filtersChanged();
    });

    window.addEventListener("hashchange", function () {
      if (syncingHash) return;
      applyHash(location.hash);
    });

    window.__setView = function (v) { setView(v, state.highlight, false); return { hash: location.hash, view: state.view }; };
    window.__clickTab = function (v) {
      const el = document.querySelector('.tabs [data-view="' + v + '"]');
      if (!el) return { error: "missing tab " + v };
      el.click();
      return {
        hash: location.hash,
        view: state.view,
        active: (document.querySelector(".tabs a.on") || {}).getAttribute("data-view") || null,
        body: document.body.getAttribute("data-view")
      };
    };
    window.__getViewState = function () {
      return {
        hash: location.hash,
        view: state.view,
        active: (document.querySelector(".tabs a.on") || {}).getAttribute("data-view") || null,
        body: document.body.getAttribute("data-view"),
        shown: (document.getElementById("showing") || {}).textContent || "",
        flags: JSON.parse(JSON.stringify(filterState.flags))
      };
    };
    window.__STATS = STATS;
    window.__MODEL_STATS = model.stats;

    if (location.hash && location.hash.length > 1) applyHash(location.hash);
    else setView("global", "", true);

    const clickName = new URLSearchParams(location.search).get("click");
    if (clickName) {
      const before = window.__getViewState();
      const after = window.__clickTab(clickName);
      const box = document.createElement("div");
      box.id = "click-proof";
      box.setAttribute("data-before-view", before.view || "");
      box.setAttribute("data-after-view", after.view || "");
      box.setAttribute("data-after-hash", after.hash || "");
      box.setAttribute("data-after-active", after.active || "");
      box.textContent = JSON.stringify({ before: before, after: after });
      box.style.cssText = "position:fixed;bottom:8px;left:8px;right:8px;z-index:99;max-height:64px;overflow:auto;background:#0b1520;color:#9fe7c4;border:1px solid #2a6;padding:6px 8px;font:11px monospace;";
      document.body.appendChild(box);
    }
  }


  /* ---------------- boot ---------------- */
  relayout();
  resize();
  initRouter();
  layoutChrome();

  const params = new URLSearchParams(location.search);
  shotMode = params.get("shot");
  const tParam = params.get("t");
  if (params.get("expanded") === "1") { state.expanded = true; relayout(); resize(); }
  if (shotMode === "start") seek(0.95, true);
  else if (shotMode === "mid") seek(6.6, true);
  else if (shotMode === "final") seek(13.2, true);
  else if (tParam != null) seek(parseFloat(tParam) || 0, params.get("pause") === "1");
  else if (state.view === "global") replay();
  else { clock = T.done; startTime = performance.now() - T.done * 1000; renderFrame(); }
})();

  </script>
</body>
